name: Refresh public market cache

# Public RSS and calendars only. Do not add portfolio, Apps Script,
# spreadsheet, or market-data API secrets to this job.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

# contents: write is only for committing the two public JSON files.
# No secrets, no pull-request permission, and no access to the spreadsheet.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public sources only
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-public-cache.mjs
      - name: Refuse anything except the public cache
        run: node scripts/assert-public-diff.mjs
      - name: Commit public cache
        run: |
          git add site/data/market-cache.json site/data/symbols.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public market cache"
          git push
      - name: Fail the run when a public source was down
        if: steps.fetch.outcome == 'failure'
        run: echo "A public source failed. The cache keeps the last good rows and records the error." && exit 1
