name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and secret scan
        run: node --test tests/format.test.mjs tests/timezone.test.mjs tests/portfolio.test.mjs tests/futu.test.mjs tests/futu-account.test.mjs tests/portfolio-adapter.test.mjs tests/secrets.test.mjs tests/layout.test.mjs tests/fx.test.mjs tests/sync-health.test.mjs tests/tabs.test.mjs tests/refresh.test.mjs tests/sw-client.test.mjs tests/team-plan.test.mjs
